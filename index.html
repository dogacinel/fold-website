<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#F2EFE7">
<meta name="description" content="FOLD Creative Agency — an independent creative agency based in Istanbul.">
<title>FOLD Creative Agency — Istanbul</title>
<style>
:root{color-scheme:light;--paper:#F2EFE7;--ink:#171717;--accent:#462639}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}body{background:var(--paper);color:var(--ink)}
main{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:clamp(22px,4vw,58px)}
.top,.bottom{width:100%;display:flex;justify-content:space-between;gap:20px;align-items:center;font-size:11px;letter-spacing:.13em;text-transform:uppercase}
.top span:last-child{color:#6e6b67}.hero{width:100%;flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:30px}
.hero img{display:block;width:min(80vw,620px);height:auto}.line{width:42px;height:1px;background:var(--ink);opacity:.35}
.hero p{margin:0;text-align:center;font-size:clamp(12px,1.2vw,15px);letter-spacing:.14em;text-transform:uppercase}
a{color:inherit;text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:3px}a:hover{color:var(--accent)}
@media(max-width:600px){main{padding:25px 22px}.top,.bottom{font-size:9px;letter-spacing:.08em}.bottom{flex-direction:column;gap:14px}.hero img{width:92vw}.hero{gap:24px}}
</style>
</head>
<body><main>
<header class="top"><span>Independent creative agency</span><span>Istanbul, TR</span></header>
<section class="hero" aria-label="FOLD Creative Agency"><img src="fold-logo.png" alt="FOLD Creative Agency"><div class="line"></div><p>Ideas first. Always.</p></section>
<footer class="bottom"><span>Website coming soon</span><a href="mailto:hello@foldcreativeagency.com">hello@foldcreativeagency.com</a></footer>
</main></body></html>
